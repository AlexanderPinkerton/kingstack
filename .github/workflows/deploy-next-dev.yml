name: Deploy Vercel Development

on:
  push:
    branches: [development]

jobs:
  run-migrations:
    environment: development
    env:
      SUPABASE_DB_DIRECT_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL }}
      SUPABASE_DB_POOL_URL: ${{ secrets.SUPABASE_DB_POOL_URL }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect Backend Setup
        id: backend
        shell: bash
        run: |
          if [[ -f .kingstack/frontend-draft ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Frontend draft detected; skipping database migrations."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Backend enabled; database migrations are required."
          fi
      - name: Set up Node
        if: ${{ steps.backend.outputs.enabled == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Cache Yarn
        if: ${{ steps.backend.outputs.enabled == 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        if: ${{ steps.backend.outputs.enabled == 'true' }}
        run: yarn install --immutable
      - name: Run Prisma Migrations
        if: ${{ steps.backend.outputs.enabled == 'true' }}
        run: yarn prisma:deploy

  deploy:
    environment: development
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    runs-on: ubuntu-latest
    needs: run-migrations
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: yarn install --immutable
      # The Vercel project referenced by VERCEL_PROJECT_ID must use
      # apps/next as its Root Directory so the sole vercel.json is loaded.
      - name: Deploy to Vercel
        run: yarn exec vercel deploy --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
